name: 📱 Build Android APK & Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Configure Bubblewrap Paths (Non-Interactive)
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          
          # Accept Android SDK licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Check environment
          bubblewrap doctor

      - name: 🔑 Generate Keystore (if not present)
        run: |
          if [ ! -f "android.keystore" ]; then
            echo "Generating release signing keystore..."
            keytool -genkey -v -keystore android.keystore -alias ledgermate \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ledgermate123" -keypass "ledgermate123" \
              -dname "CN=LedgerMate, OU=Apps, O=LedgerMate, L=Chennai, S=TamilNadu, C=IN"
          fi

      - name: 🚀 Build Android APK & AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "ledgermate123"
          BUBBLEWRAP_KEY_PASSWORD: "ledgermate123"
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="android.keystore" \
            --signingKeyAlias="ledgermate"

      - name: 📤 Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerMate-Android-APK
          path: |
            *.apk
            *.aab
          retention-days: 30

      - name: 🏷️ Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "LedgerMate Android APK"
          tag_name: "v1.0.0-apk"
          files: |
            *.apk
            *.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
