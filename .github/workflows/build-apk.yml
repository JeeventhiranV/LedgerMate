name: 📱 Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Calculate Deterministic Build Number
        id: build_ver
        run: |
          # Highest historical APK release baseline
          LATEST_CODE=356
          REMOTE_CODE=$(curl -sL --max-time 10 "https://github.com/${{ github.repository }}/releases/download/latest/version.json" | grep -o '"apkVersionCode"[^,]*' | grep -o '[0-9]*' | head -n 1 || echo "0")
          if [ -n "$REMOTE_CODE" ] && [ "$REMOTE_CODE" -gt "$LATEST_CODE" ] 2>/dev/null; then
            LATEST_CODE=$REMOTE_CODE
          fi

          GIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUM=$(( GIT_COUNT + 12 ))
          if [ "$BUILD_NUM" -le "$LATEST_CODE" ]; then
            BUILD_NUM=$(( LATEST_CODE + 1 ))
          fi
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "version_name=1.0.${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "Calculated APK VersionCode: ${BUILD_NUM}, VersionName: 1.0.${BUILD_NUM} (Latest Release was: ${LATEST_CODE})"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build APKs with Gradle Wrapper
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.build_ver.outputs.build_number }}
          VERSION_NAME: ${{ steps.build_ver.outputs.version_name }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon
          cd ..
          mkdir -p build-assets
          cp android/app/build/outputs/apk/release/app-release.apk build-assets/app-release.apk 2>/dev/null || cp android/app/build/outputs/apk/release/*.apk build-assets/app-release.apk
          cp build-assets/app-release.apk build-assets/LedgerMate-v${{ steps.build_ver.outputs.version_name }}.apk
          
          # Generate fresh version.json for this APK build
          cat <<EOF > build-assets/version.json
          {
            "version": "lm-v${{ steps.build_ver.outputs.version_name }}",
            "commit": "${GITHUB_SHA:0:7}",
            "build_date": "$(date +%Y%m%d)",
            "timestamp": $(date +%s000),
            "apkVersionCode": ${{ steps.build_ver.outputs.build_number }},
            "apkVersionName": "${{ steps.build_ver.outputs.version_name }}",
            "apkDownloadUrl": "https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk",
            "releaseNotes": "Feature updates, performance enhancements, UI improvements, and bug fixes."
          }
          EOF

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerMate-Android-APK
          path: |
            build-assets/*.apk
            build-assets/version.json
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Publish / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "LedgerMate Android App v${{ steps.build_ver.outputs.version_name }}"
          tag_name: "latest"
          files: |
            build-assets/app-release.apk
            build-assets/LedgerMate-v${{ steps.build_ver.outputs.version_name }}.apk
            build-assets/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Trigger GitHub Pages Deploy to Update Version Metadata
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy.yml workflow to publish updated version metadata to GitHub Pages..."
          gh workflow run deploy.yml --ref main || echo "Workflow dispatch trigger fallback"

