name: 📱 Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build APKs with Gradle Wrapper
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon
          cd ..
          mkdir -p build-assets
          cp android/app/build/outputs/apk/release/app-release.apk build-assets/app-release.apk 2>/dev/null || cp android/app/build/outputs/apk/release/*.apk build-assets/app-release.apk
          cp build-assets/app-release.apk build-assets/LedgerMate-v1.0.${{ github.run_number }}.apk

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerMate-Android-APK
          path: |
            build-assets/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Publish / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "LedgerMate Android App v1.0.${{ github.run_number }}"
          tag_name: "latest"
          files: |
            build-assets/app-release.apk
            build-assets/LedgerMate-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
