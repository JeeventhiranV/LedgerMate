name: 📱 Build Android APK & Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Install Bubblewrap CLI & Expect
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @bubblewrap/cli

      - name: 🔑 Generate Keystore (if not present)
        run: |
          if [ ! -f "android.keystore" ]; then
            echo "Generating release signing keystore..."
            keytool -genkey -v -keystore android.keystore -alias ledgermate \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ledgermate123" -keypass "ledgermate123" \
              -dname "CN=LedgerMate, OU=Apps, O=LedgerMate, L=Chennai, S=TamilNadu, C=IN"
          fi

      - name: 🚀 Build Android APK & AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "ledgermate123"
          BUBBLEWRAP_KEY_PASSWORD: "ledgermate123"
        run: |
          expect -c '
            set timeout 600
            spawn bubblewrap build --skipPwaValidation --signingKeyPath=android.keystore --signingKeyAlias=ledgermate
            expect {
              "Do you want Bubblewrap to install the JDK" { send "y\r"; exp_continue }
              "Do you want Bubblewrap to install the Android SDK" { send "y\r"; exp_continue }
              "Do you agree to the Android SDK terms" { send "y\r"; exp_continue }
              "Password for the Key Store" { send "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"; exp_continue }
              "Password for the Key" { send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"; exp_continue }
              eof
            }
          '

      - name: 📤 Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerMate-Android-APK
          path: |
            *.apk
            *.aab
          retention-days: 30

      - name: 🏷️ Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "LedgerMate Android APK"
          tag_name: "v1.0.0-apk"
          files: |
            *.apk
            *.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
