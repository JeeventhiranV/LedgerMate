plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jeeva.ledgermate'
    compileSdk 34

    def buildNum = System.getenv("BUILD_NUMBER") ?: (project.hasProperty("BUILD_NUMBER") ? project.property("BUILD_NUMBER") : "1")
    def verName  = System.getenv("VERSION_NAME") ?: (project.hasProperty("VERSION_NAME") ? project.property("VERSION_NAME") : "1.0.0")

    defaultConfig {
        applicationId "com.jeeva.ledgermate"
        minSdk 21
        targetSdk 34
        versionCode buildNum.toInteger()
        versionName verName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = (System.getenv("KEYSTORE_PATH") ?: (project.hasProperty("KEYSTORE_PATH") ? project.property("KEYSTORE_PATH") : "release.keystore")).toString().trim()
            if (ksPath.isEmpty()) ksPath = "release.keystore"
            def ksPass = (System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty("KEYSTORE_PASSWORD") ? project.property("KEYSTORE_PASSWORD") : "ledgermate123")).toString().trim()
            if (ksPass.isEmpty()) ksPass = "ledgermate123"
            def kAlias = (System.getenv("KEY_ALIAS") ?: (project.hasProperty("KEY_ALIAS") ? project.property("KEY_ALIAS") : "ledgermate")).toString().trim()
            if (kAlias.isEmpty()) kAlias = "ledgermate"
            def kPass  = (System.getenv("KEY_PASSWORD") ?: (project.hasProperty("KEY_PASSWORD") ? project.property("KEY_PASSWORD") : "ledgermate123")).toString().trim()
            if (kPass.isEmpty()) kPass = "ledgermate123"

            storeFile file(ksPath)
            storePassword ksPass
            keyAlias kAlias
            keyPassword kPass
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

