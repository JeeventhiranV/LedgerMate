<style>
/* ── TOPIC PAGE SPECIFIC STYLES ── */
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg, #0a0c10);
  color: var(--text, #fff);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.topic-page-layout {
  display: flex;
  min-height: 100vh;
  position: relative;
  width: 100%;
  overflow-x: hidden;
}

/* ── SIDEBAR DRAWER (CLOSED BY DEFAULT ON ALL SCREEN SIZES) ── */
.topic-sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s cubic-bezier(.4, 0, .2, 1);
}
.topic-sidebar-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.topic-sidebar {
  width: 320px;
  max-width: 88vw;
  background: var(--bg2, #11141c);
  border-right: 1px solid var(--border, #262f45);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 1001;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(.4, 0, .2, 1);
  box-shadow: 6px 0 32px rgba(0, 0, 0, 0.6);
}
.topic-sidebar.open {
  transform: translateX(0);
}

.topic-sidebar-inner {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* ── MAIN CONTENT: ALWAYS TAKES FULL WIDTH ── */
.topic-main {
  margin-left: 0 !important;
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg, #0a0c10);
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: rgba(17, 20, 28, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border, #262f45);
  position: sticky;
  top: 0;
  z-index: 900;
  gap: 12px;
  width: 100%;
}

.menu-btn {
  display: flex !important;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border, #262f45);
  color: var(--text, #fff);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.menu-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--blue, #4f8ef7);
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--text, #fff);
  white-space: nowrap;
}

.topbar-custom-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border, #262f45);
  color: var(--text2, #a6b0cf);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.topbar-custom-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text, #fff);
  border-color: var(--blue, #4f8ef7);
}

.topbar-user-chip {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.topbar-user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(79, 142, 247, 0.3);
}

/* ── SIDEBAR STYLES ── */
.sidebar-track-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text, #fff);
  border-left: 3px solid var(--track-color, #38bdf8);
  margin-bottom: 6px;
  background: rgba(255,255,255,0.02);
  border-radius: 0 6px 6px 0;
}
.sidebar-track-icon {
  font-size: 15px;
}
.sidebar-track-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-module-group {
  margin-left: 8px;
  margin-bottom: 8px;
  border-left: 1px dashed rgba(255,255,255,0.08);
  padding-left: 8px;
}
.sidebar-module-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3, #8a95b8);
  padding: 3px 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-mini-add-btn {
  background: none;
  border: 1px solid var(--border, #262f45);
  color: var(--text3, #8a95b8);
  border-radius: 4px;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  cursor: pointer;
  transition: all .2s;
}
.sidebar-mini-add-btn:hover {
  color: var(--text, #fff);
  border-color: var(--blue, #4f8ef7);
  background: rgba(79,142,247,0.1);
}
.sidebar-topics-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 2px;
}
.sidebar-topic-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--text2, #a6b0cf);
  font-size: 12.5px;
  text-decoration: none;
  transition: all 0.15s ease;
  min-width: 0;
}
.sidebar-topic-item:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text, #fff);
}
.sidebar-topic-item.active {
  background: linear-gradient(135deg, rgba(79,142,247,0.18), rgba(139,92,246,0.15));
  border: 1px solid rgba(79,142,247,0.35);
  color: var(--blue, #4f8ef7);
  font-weight: 600;
}
.sidebar-topic-title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-topic-badge {
  font-size: 10px;
  background: rgba(255,255,255,0.06);
  padding: 1px 6px;
  border-radius: 10px;
  color: var(--text3, #8a95b8);
}
.sidebar-topic-item.active .sidebar-topic-badge {
  background: var(--blue, #4f8ef7);
  color: #fff;
}

/* ── TOPIC HERO ── */
.topic-workspace-hero {
  background: linear-gradient(180deg, rgba(17,20,28,0.95), rgba(10,12,16,0.9));
  border-bottom: 1px solid var(--border, #262f45);
  padding: 24px 32px 20px;
  width: 100%;
}
.topic-breadcrumb-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text3, #8a95b8);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.breadcrumb-link {
  color: var(--text2, #a6b0cf);
  text-decoration: none;
  transition: color .2s;
}
.breadcrumb-link:hover {
  color: var(--blue, #4f8ef7);
}
.breadcrumb-sep {
  opacity: 0.5;
  font-size: 10px;
}
.breadcrumb-current {
  color: var(--text, #fff);
  font-weight: 600;
}
.topic-hero-main-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.topic-hero-title-group {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  min-width: 0;
  flex: 1;
}
.topic-hero-icon {
  font-size: 32px;
  line-height: 1;
  background: rgba(255,255,255,0.04);
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border, #262f45);
  flex-shrink: 0;
}
.topic-hero-title {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  font-weight: 800;
  color: var(--text, #fff);
  line-height: 1.25;
  word-break: break-word;
}
.topic-hero-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12.5px;
  color: var(--text3, #8a95b8);
  margin-top: 6px;
  flex-wrap: wrap;
}
.topic-hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.topic-status-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.03);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--border, #262f45);
}
.topic-status-dropdown {
  background: var(--bg3, #181d28);
  color: var(--text, #fff);
  border: 1px solid var(--border, #262f45);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}

/* ── WORKSPACE CONTENT ── */
.topic-workspace-body {
  padding: 24px 32px;
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  box-sizing: border-box;
}
.topic-workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 24px;
  margin-bottom: 28px;
  width: 100%;
}
.topic-notes-card, .topic-upload-card {
  background: var(--bg2, #11141c);
  border: 1px solid var(--border, #262f45);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
}
.topic-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  flex-wrap: wrap;
  gap: 8px;
}
.topic-card-title {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text, #fff);
  display: flex;
  align-items: center;
  gap: 8px;
}
.note-save-badge {
  font-size: 11px;
  color: var(--teal, #06d6a0);
  font-weight: 600;
}
.topic-notes-textarea {
  width: 100%;
  min-height: 230px;
  flex: 1;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border, #262f45);
  border-radius: 10px;
  padding: 14px;
  color: var(--text, #fff);
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  line-height: 1.65;
  resize: vertical;
  outline: none;
  box-sizing: border-box;
  transition: border .2s, box-shadow .2s;
}
.topic-notes-textarea:focus {
  border-color: var(--blue, #4f8ef7);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
}

/* ── MATERIALS SECTION ── */
.topic-materials-section {
  background: var(--bg2, #11141c);
  border: 1px solid var(--border, #262f45);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 28px;
  width: 100%;
  min-width: 0;
}
.topic-materials-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.topic-materials-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text, #fff);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topic-mat-filter-tabs {
  display: flex;
  gap: 6px;
  background: rgba(0,0,0,0.3);
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border, #262f45);
  flex-wrap: wrap;
}
.mat-filter-btn {
  background: none;
  border: none;
  color: var(--text3, #8a95b8);
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.mat-filter-btn.active {
  background: var(--bg3, #181d28);
  color: var(--text, #fff);
  font-weight: 700;
}
.topic-materials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  width: 100%;
}
.topic-page-mat-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border, #262f45);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform .18s, border-color .18s;
  min-width: 0;
}
.topic-page-mat-card:hover {
  transform: translateY(-2px);
  border-color: rgba(79,142,247,0.4);
}
.topic-page-mat-card.preview-active {
  border-color: var(--blue, #4f8ef7);
  box-shadow: 0 0 0 2px rgba(79,142,247,0.25);
  background: rgba(79,142,247,0.04);
}
.mat-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mat-card-size {
  font-size: 11px;
  color: var(--text3, #8a95b8);
}
.mat-card-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text, #fff);
  line-height: 1.35;
  margin-bottom: 4px;
  word-break: break-word;
}
.mat-card-desc {
  font-size: 12px;
  color: var(--text3, #8a95b8);
  line-height: 1.4;
  max-height: 48px;
  overflow: hidden;
}
.mat-card-storage-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--cyan, #38bdf8);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mat-card-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mat-card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.ws-btn-danger-icon {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  opacity: 0.6;
  transition: opacity .2s;
}
.ws-btn-danger-icon:hover {
  opacity: 1;
}

/* ── IN-PAGE PREVIEWER CARD ── */
.inpage-material-previewer-card {
  background: var(--bg2, #11141c);
  border: 2px solid var(--blue, #4f8ef7);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 28px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  animation: fadeIn 0.25s ease;
  width: 100%;
  box-sizing: border-box;
}
.inpage-preview-header-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
  gap: 8px;
}
.inpage-preview-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.inpage-pdf-frame-wrap {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border, #262f45);
  width: 100%;
}
.inpage-code-block {
  background: #0f172a;
  padding: 16px;
  border-radius: 10px;
  color: #38bdf8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  overflow-x: auto;
  max-height: 480px;
  line-height: 1.6;
  border: 1px solid rgba(56,189,248,0.2);
  width: 100%;
  box-sizing: border-box;
}
.inpage-link-hero-box {
  padding: 32px 20px;
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  border: 1px solid var(--border, #262f45);
  text-align: center;
  width: 100%;
}

.empty-topic-state, .empty-mats-box {
  padding: 36px 20px;
  text-align: center;
  color: var(--text3, #8a95b8);
  font-size: 13px;
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  border: 1px dashed rgba(255,255,255,0.08);
}

/* ── RESPONSIVENESS ── */
@media (max-width: 960px) {
  .topic-workspace-grid {
    grid-template-columns: 1fr;
  }
  .topic-workspace-hero, .topic-workspace-body {
    padding: 16px 18px;
  }
}
@media (max-width: 600px) {
  .topbar {
    padding: 10px 14px;
  }
  .topbar-page-badge {
    display: none !important;
  }
  .topic-hero-title {
    font-size: 20px;
  }
  .topic-workspace-hero, .topic-workspace-body {
    padding: 12px 14px;
  }
  .topic-materials-section {
    padding: 16px;
  }
  .topic-materials-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="topic-page-layout">

  <!-- BACKDROP OVERLAY FOR OFF-CANVAS SIDEBAR -->
  <div class="topic-sidebar-overlay" id="sidebarOverlay" onclick="window.StudyTopicPage.toggleSidebar(false, event)"></div>

  <!-- ╔═════════════════════ SIDEBAR (DRAWER) ═════════════════════╗ -->
  <aside class="topic-sidebar" id="sidebar">
    <div class="sidebar-logo" style="display:flex;align-items:center;justify-content:space-between;padding:16px 14px;border-bottom:1px solid var(--border,#262f45);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="logo-badge" style="font-size:18px;">📖</div>
        <div>
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14.5px;color:var(--text,#fff);">Topic Workspace</div>
          <div style="font-size:11px;color:var(--text3,#8a95b8);">Study Resources Hub</div>
        </div>
      </div>
      <button class="sidebar-close-btn" onclick="window.StudyTopicPage.toggleSidebar(false, event)" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;" title="Close Menu">✕</button>
    </div>

    <div class="search-wrap" style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04);">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="sidebarSearch" placeholder="Search topics & notes…" autocomplete="off" oninput="window.StudyTopicPage.handleSidebarSearch(this.value)"/>
    </div>

    <div class="topic-sidebar-inner" id="sidebarTopicTree">
      <!-- Populated dynamically by StudyTopicPage.js -->
    </div>

    <!-- ALL STUDY TOOLS ACCESSIBLE IN SLIDE-OUT MENU -->
